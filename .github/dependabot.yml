version: 2

updates:
  # Maven dependencies and build plugins.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "java"]
    commit-message:
      prefix: "build"
      include: scope
    groups:
      # Spring Boot's modules are released together and must move together; one pull request per
      # module would produce a set of individually unmergeable changes.
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.security:*"
      testing:
        patterns:
          - "org.testcontainers:*"
          - "org.junit*:*"
          - "org.jacoco:*"

  # Base images in the Dockerfile.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "build"

  # Workflow actions. These are pinned to commit SHAs; Dependabot updates the SHA and the
  # version comment together, which is the main reason SHA pinning stays maintainable.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
