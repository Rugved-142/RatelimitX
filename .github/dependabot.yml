version: 2

updates:
  # Maven dependencies and build plugins.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels: ["dependencies", "java"]
    commit-message:
      prefix: "build"
      include: scope
    groups:
      # Spring Boot's modules are released together and must move together; one pull request per
      # module would produce a set of individually unmergeable changes.
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.security:*"
      testing:
        # Minor and patch only. A major bump of a test library tends to come with its own
        # migration, and bundling several of those into one pull request makes it unreviewable;
        # majors still arrive, one dependency at a time.
        update-types:
          - minor
          - patch
        patterns:
          - "org.testcontainers:*"
          - "org.junit*:*"
          - "org.jacoco:*"

    ignore:
      # Patch only. 4.0.9 was chosen to clear a set of CRITICAL advisories, and a minor bump of
      # the parent moves the managed version of every Spring dependency at once - which is a
      # thing to do on purpose, with the test suite and the benchmarks in front of you, not
      # because it is Monday. Patches still arrive, which is how the next advisory gets fixed.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

      # Gatling: no updates at all.
      #
      # The published benchmark figures were produced by this version of the simulation, on this
      # version of the harness. Changing it invalidates the comparison between the committed runs
      # and anything measured afterwards, so a bump means deliberately re-running and
      # regenerating docs/benchmarks.md - not merging a dependency pull request. Bump it by hand
      # when there is a reason to, and re-measure in the same change.
      - dependency-name: "io.gatling:gatling-app"
      - dependency-name: "io.gatling.highcharts:*"

      # The Gatling simulation is Scala source, so the Scala major version is a language
      # migration rather than a dependency bump.
      - dependency-name: "org.scala-lang:scala-library"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis.clients:jedis"
        update-types: ["version-update:semver-major"]

  # Base images in the Dockerfile.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "build"
    ignore:
      # Both base images carry the Java version, so moving either one is a JDK migration. That
      # happens deliberately, not on a Monday morning pull request.
      #
      # The runtime image is tagged by the Java version alone, so ignoring semver-major pins it.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # The build image is not: its tag is 3.9-eclipse-temurin-21, where the Java version is a
      # suffix and the image version stays 3.9. A semver-major ignore has nothing to match, which
      # is how Dependabot came to offer 3.9-eclipse-temurin-26. So this one is ignored outright.
      # It only builds the jar - the runtime image above is what ships - so pinning it costs
      # little. Bump it by hand when migrating off Java 21.
      - dependency-name: "maven"

  # Workflow actions. These are pinned to commit SHAs; Dependabot updates the SHA and the
  # version comment together, which is the main reason SHA pinning stays maintainable.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
    groups:
      # One pull request for all of them. Action bumps are small and arrive together, and
      # reviewing four SHA changes in one place is easier than in four places.
      actions:
        patterns:
          - "*"
