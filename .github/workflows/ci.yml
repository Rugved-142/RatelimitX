name: CI

# Actions are pinned to commit SHAs rather than tags. A tag can be moved to point at different
# code, so pinning by tag alone means a third party can change what runs in this pipeline. The
# human-readable version is kept in the trailing comment, and Dependabot updates both together.

on:
  push:
    branches: ["main", "hardening"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch; a new push cancels the previous run rather than queueing behind it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The integration tests start Redis and PostgreSQL with Testcontainers. Docker is already
      # running on GitHub-hosted Ubuntu runners; this step fails early with a clear message if
      # that ever stops being true, instead of surfacing as a confusing container error.
      - name: Verify Docker is available
        run: docker version

      - name: Build, test and verify
        run: ./mvnw -B verify

      # Uploaded even when the build fails: a failed run is exactly when the reports are wanted.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  scripts:
    name: Analysis scripts and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The benchmark and failure-test reports are generated by Python, so a mistake there puts a
    # wrong number in the documentation. Those generators have their own tests and they belong in
    # the pipeline alongside the Java ones.
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install pytest and pyyaml
        # pyyaml is needed by test_k8s_manifests.py, which checks the Kubernetes manifests
        # statically so a regression is caught on every push rather than only when kind runs.
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 pyyaml==6.0.2

      - name: Run the report generator tests
        run: python -m pytest scripts -q

      # A rule file with a typo loads as nothing and alerts silently never fire, which is worse
      # than having no rules at all. promtool parses both the config and the rules.
      - name: Check the Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.47.0 \
            check config /etc/prometheus/prometheus.yml

  kubernetes:
    name: Kubernetes on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    # Until this job is green, nothing in the documentation may claim the service runs on
    # Kubernetes. The manifests are checked statically in the scripts job above; this one
    # actually deploys them, proves the Service answers through both replicas, and kills a pod
    # under load to show it keeps answering.
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      # Installed from the release binary with a recorded checksum rather than through a
      # third-party action, for the same reason the actions above are pinned by commit SHA: this
      # is the one place where what runs in the pipeline is decided.
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum --check --strict
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      # Creates the cluster, builds the image into it, applies k8s/, and fails unless both
      # replicas are ready endpoints and the API answers through the Service.
      - name: Bring up the cluster
        run: scripts/kind-up.sh

      - name: Show what is running
        run: |
          kubectl --context kind-ratelimitx -n ratelimitx get pods -o wide
          kubectl --context kind-ratelimitx -n ratelimitx get svc,endpointslice

      # Deletes one of the two replicas under steady load and fails if the caller saw a single
      # 5xx or dropped connection.
      - name: Pod kill test under load
        run: scripts/pod-kill-test.sh --baseline 20 --observe 60

      - name: Fail if the pod kill test recorded any failure
        run: |
          python3 - <<'PY'
          import glob, json, sys
          runs = sorted(glob.glob("docs/pod-kill-tests/*/summary.json"))
          if not runs:
              sys.exit("the pod kill test produced no summary")
          totals = json.load(open(runs[-1]))["totals"]
          print(json.dumps(totals, indent=2))
          if totals["failures"]:
              sys.exit(f"{totals['failures']} of {totals['requests']} requests failed")
          if totals["requests"] < 100:
              sys.exit(f"only {totals['requests']} requests were recorded; too few to mean anything")
          PY

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl --context kind-ratelimitx -n ratelimitx get all -o wide || true
          kubectl --context kind-ratelimitx -n ratelimitx describe pods || true
          kubectl --context kind-ratelimitx -n ratelimitx logs -l app.kubernetes.io/name=ratelimitx \
            --tail=200 --all-containers || true

      - name: Upload the run data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-kill-test
          path: docs/pod-kill-tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down
        if: always()
        run: kind delete cluster --name ratelimitx || true

  image:
    name: Build image and scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag ratelimitx:${{ github.sha }} .

      # Report-only for now: the scan runs and its findings are published, but a vulnerability in
      # a base image does not block the pipeline. Once the findings have been read and the
      # unavoidable ones triaged, set exit-code to 1 so regressions fail the build.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ratelimitx:${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"

      - name: Show Trivy findings in the log
        if: always()
        run: cat trivy-report.txt || echo "no Trivy report produced"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: warn
          retention-days: 14
