name: CI

# Actions are pinned to commit SHAs rather than tags. A tag can be moved to point at different
# code, so pinning by tag alone means a third party can change what runs in this pipeline. The
# human-readable version is kept in the trailing comment, and Dependabot updates both together.

on:
  push:
    branches: ["main", "hardening"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch; a new push cancels the previous run rather than queueing behind it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The integration tests start Redis and PostgreSQL with Testcontainers. Docker is already
      # running on GitHub-hosted Ubuntu runners; this step fails early with a clear message if
      # that ever stops being true, instead of surfacing as a confusing container error.
      - name: Verify Docker is available
        run: docker version

      - name: Build, test and verify
        run: ./mvnw -B verify

      # Uploaded even when the build fails: a failed run is exactly when the reports are wanted.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  image:
    name: Build image and scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag ratelimitx:${{ github.sha }} .

      # Report-only for now: the scan runs and its findings are published, but a vulnerability in
      # a base image does not block the pipeline. Once the findings have been read and the
      # unavoidable ones triaged, set exit-code to 1 so regressions fail the build.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ratelimitx:${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"

      - name: Show Trivy findings in the log
        if: always()
        run: cat trivy-report.txt || echo "no Trivy report produced"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: warn
          retention-days: 14
