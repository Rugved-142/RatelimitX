spring.application.name=ratelimitx
server.port=8080


spring.data.redis.host=localhost
spring.data.redis.port=6379
# Fail fast when Redis is unreachable or slow. A rate limit check is on the request path, so a
# long wait is worse than falling back to the local limiter: these short timeouts turn an outage
# into a quickly-tripped circuit breaker instead of a pile of stalled threads.
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms


# No password here on purpose: supply it as SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/ratelimitx
spring.datasource.username=ratelimitx
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
# SQL logging is off here and enabled only by the dev profile: it writes several lines per query
# on the request path, which is a real cost under load and buries everything else in the log.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# SHUTDOWN
# ============================================================
# Stop accepting new connections on SIGTERM, then let in-flight requests finish before the JVM
# exits. Without this the container is killed mid-request and the caller sees a dropped
# connection, which during a rolling update means every rollout drops some requests.
#
# The timeout is the ceiling, not a wait: shutdown completes as soon as the last in-flight
# request does. It must stay below the Kubernetes terminationGracePeriodSeconds (45s in
# k8s/30-app.yaml) with room for the preStop pause, or the kubelet will SIGKILL part way
# through the graceful phase and undo the point of it.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# jwt.secret has no default: it is bound from the JWT_SECRET environment variable and the
# application refuses to start without a value of at least 32 bytes. See JwtProperties.
# jwt.expiration is in milliseconds.
jwt.expiration=86400000

# Algorithm: fixed-window, token-bucket, sliding-window
ratelimit.algorithm=sliding-window

# Token bucket default capacity, used only when no caller limit is supplied. On the request path
# the capacity is the caller's tier limit and the refill rate is that limit divided by 60 seconds,
# so there is no configurable refill rate to set.
ratelimit.bucket-capacity=10

# Window-based Settings (Fixed & Sliding)
ratelimit.max-requests=10
ratelimit.window-size-seconds=60

# Circuit breaker around the Redis limiters.
ratelimit.circuit-breaker.failure-threshold=3
ratelimit.circuit-breaker.timeout=30s

# Local in-memory fallback used while the circuit is open. These limits apply PER INSTANCE:
# N instances admit up to N x limit per window between them.
ratelimit.fallback.window-size-ms=60000
ratelimit.fallback.default-max-requests=10
ratelimit.fallback.eviction-after-ms=300000
ratelimit.fallback.eviction-interval-ms=60000

# Bounds on administrative SCAN walks of the keyspace.
ratelimit.admin.scan-limit=10000
ratelimit.admin.scan-batch=500

# Per-client-IP throttling of the unauthenticated auth endpoints (requests per minute).
ratelimit.auth.login-limit-per-minute=5
ratelimit.auth.register-limit-per-minute=5
# Only enable where a trusted proxy overwrites X-Forwarded-For; clients can forge it.
ratelimit.auth.trust-forwarded-for=false

# ============================================================
# ACTUATOR & PROMETHEUS METRICS
# ============================================================
# Actuator is served on its own port, which docker compose does not publish. Prometheus scrapes
# it over the internal network. Never publish this port.
management.server.port=9091
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=ratelimitx
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.prometheus.metrics.export.enabled=true

# ============================================================
# ANALYTICS EVENT FEED (KAFKA)
# ============================================================
# Off by default, and off is the normal deployment. With it off no thread starts, nothing
# contacts a broker, and /api/data does exactly the work it did before this feature existed.
# The feed is best effort: it is an analytics stream, not an audit log, and events are dropped
# rather than allowed to slow a request down. See docs/adr/0005-analytics-off-the-decision-path.md.
ratelimit.events.enabled=false
ratelimit.events.topic=ratelimit-events
ratelimit.events.queue-capacity=1000
ratelimit.events.send-timeout=2s

# The consumer that turns events into hourly aggregates. Enabled separately from the producer so
# one deployment can publish while another aggregates.
ratelimit.analytics.enabled=false

spring.kafka.bootstrap-servers=localhost:9092

# A send must fail fast or it is not best effort. max.block.ms caps how long a send waits for
# metadata when the broker is unreachable - its default is 60s, which would park the publisher
# thread for a minute per event and fill the queue behind it.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# JacksonJsonSerializer, not JsonSerializer: the latter is the Jackson 2 implementation, and
# Spring Boot 4 ships Jackson 3 (tools.jackson). The Jackson 2 pair fails on the event's Instant
# field, because java.time support is a separate module there and is built in to Jackson 3.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.properties.max.block.ms=100
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.request.timeout.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=2000

# ErrorHandlingDeserializer keeps a malformed payload from being retried forever: it turns the
# failure into a record the error handler can route to the dead letter topic.
spring.kafka.consumer.group-id=ratelimitx-analytics
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ratelimitx.core.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.ratelimitx.core.events.RateLimitEvent
# Always deserialize to the type above rather than whatever a record's type header claims. A
# record produced by something other than this application may carry no header at all, and a
# payload that cannot become a RateLimitEvent should fail here and be parked, not be guessed at.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# One record at a time: the consumer's idempotency is per event id, so committing per record
# keeps a redelivery to the single event that was in flight.
spring.kafka.listener.ack-mode=record
