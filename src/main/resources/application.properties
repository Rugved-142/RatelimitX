spring.application.name=ratelimitx
server.port=8080


spring.data.redis.host=localhost
spring.data.redis.port=6379
# Fail fast when Redis is unreachable or slow. A rate limit check is on the request path, so a
# long wait is worse than falling back to the local limiter: these short timeouts turn an outage
# into a quickly-tripped circuit breaker instead of a pile of stalled threads.
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms


# No password here on purpose: supply it as SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/ratelimitx
spring.datasource.username=ratelimitx
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
# SQL logging is off here and enabled only by the dev profile: it writes several lines per query
# on the request path, which is a real cost under load and buries everything else in the log.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# SHUTDOWN
# ============================================================
# Stop accepting new connections on SIGTERM, then let in-flight requests finish before the JVM
# exits. Without this the container is killed mid-request and the caller sees a dropped
# connection, which during a rolling update means every rollout drops some requests.
#
# The timeout is the ceiling, not a wait: shutdown completes as soon as the last in-flight
# request does. It must stay below the Kubernetes terminationGracePeriodSeconds (45s in
# k8s/30-app.yaml) with room for the preStop pause, or the kubelet will SIGKILL part way
# through the graceful phase and undo the point of it.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# jwt.secret has no default: it is bound from the JWT_SECRET environment variable and the
# application refuses to start without a value of at least 32 bytes. See JwtProperties.
# jwt.expiration is in milliseconds.
jwt.expiration=86400000

# Algorithm: fixed-window, token-bucket, sliding-window
ratelimit.algorithm=sliding-window

# Token bucket defaults, used only when no caller limit is supplied. On the request path the
# capacity is the caller's tier limit and the refill rate is that limit divided by 60 seconds.
ratelimit.bucket-capacity=10
ratelimit.refill-rate=1.0

# Window-based Settings (Fixed & Sliding)
ratelimit.max-requests=10
ratelimit.window-size-seconds=60

# Default rate limits by role
ratelimit.default.user=10
ratelimit.default.premium=100
ratelimit.default.admin=1000

# Circuit breaker around the Redis limiters.
ratelimit.circuit-breaker.failure-threshold=3
ratelimit.circuit-breaker.timeout=30s

# Local in-memory fallback used while the circuit is open. These limits apply PER INSTANCE:
# N instances admit up to N x limit per window between them.
ratelimit.fallback.window-size-ms=60000
ratelimit.fallback.default-max-requests=10
ratelimit.fallback.eviction-after-ms=300000
ratelimit.fallback.eviction-interval-ms=60000

# Bounds on administrative SCAN walks of the keyspace.
ratelimit.admin.scan-limit=10000
ratelimit.admin.scan-batch=500

# Per-client-IP throttling of the unauthenticated auth endpoints (requests per minute).
ratelimit.auth.login-limit-per-minute=5
ratelimit.auth.register-limit-per-minute=5
# Only enable where a trusted proxy overwrites X-Forwarded-For; clients can forge it.
ratelimit.auth.trust-forwarded-for=false

# ============================================================
# ACTUATOR & PROMETHEUS METRICS
# ============================================================
# Actuator is served on its own port, which docker compose does not publish. Prometheus scrapes
# it over the internal network. Never publish this port.
management.server.port=9091
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=ratelimitx
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.prometheus.metrics.export.enabled=true
