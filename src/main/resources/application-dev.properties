# Development profile: activate with SPRING_PROFILES_ACTIVE=dev or --spring.profiles.active=dev.
#
# Everything here is for local debugging and is deliberately absent from the default profile.

# Log every SQL statement, formatted. Several lines per query, so never enable this in a
# deployment that takes real traffic.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log the values bound to statement parameters as well.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Rate limiting decisions, circuit breaker transitions and fallback use.
logging.level.com.ratelimitx.core=DEBUG
