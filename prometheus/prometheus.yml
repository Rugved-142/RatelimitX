global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ratelimitx-monitor'

# Alerting rules. There is no Alertmanager in docker-compose.yml, so these fire into
# Prometheus' own alert list at /alerts and nowhere else; routing them to a human is a deployment
# concern. Each rule records how its threshold was derived.
rule_files:
  - '/etc/prometheus/rules/*.rules.yml'

scrape_configs:
  # RateLimitX Application Metrics
  - job_name: 'ratelimitx'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # The application's management port. Not published to the host by docker compose.
      - targets: ['app:9091']
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
