services:
  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  # Host ports for the backing services are bound to 127.0.0.1 so they are reachable from this
  # machine only. Containers still reach each other over ratelimitx-network on the same ports.
  postgres:
    image: postgres:16-alpine
    container_name: ratelimitx-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ratelimitx-network

  # ============================================================
  # REDIS SERVICE
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ratelimitx-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ratelimitx-network

  # ============================================================
  # RATELIMITX APPLICATION
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ratelimitx-app
    # Only the API port is published. The management port (9091) is deliberately absent: actuator
    # is reachable from inside the network, which is all Prometheus and the healthcheck need.
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL must be set in .env}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME must be set in .env}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in .env}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      # No fallback value: the application fails fast if this is missing or shorter than 32 bytes.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      # Per-IP caps on the auth endpoints. The defaults here are the production values; they are
      # overridable only so a benchmark can provision its users, which would otherwise take
      # minutes at 5 registrations a minute. Nothing else should change them.
      - RATELIMIT_AUTH_LOGIN_LIMIT_PER_MINUTE=${RATELIMIT_AUTH_LOGIN_LIMIT_PER_MINUTE:-5}
      - RATELIMIT_AUTH_REGISTER_LIMIT_PER_MINUTE=${RATELIMIT_AUTH_REGISTER_LIMIT_PER_MINUTE:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ratelimitx-network

  # ============================================================
  # PROMETHEUS MONITORING
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: ratelimitx-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ratelimitx-network
    depends_on:
      - app

  # ============================================================
  # GRAFANA DASHBOARDS
  # ============================================================
  grafana:
    image: grafana/grafana:10.1.0
    container_name: ratelimitx-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # No admin/admin default: both come from .env and the stack will not start without them.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
      - TZ=UTC
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ratelimitx-network
    depends_on:
      - prometheus

# ============================================================
# VOLUMES (Persistent Storage)
# ============================================================
volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

# ============================================================
# NETWORKS
# ============================================================
networks:
  ratelimitx-network:
    driver: bridge
